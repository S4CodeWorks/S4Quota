<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>
    @font-face{font-family:S4Source;src:url('../../../node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2') format('woff2')}
    text{font-family:S4Source,"Segoe UI",sans-serif;fill:#171816}.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.025em}.meta{font-size:11px;fill:#666961}.label{font-size:12px;font-weight:600;letter-spacing:.015em}.note{font-size:13px;fill:#4c4e47}.icon{fill:none;stroke:#4c4e47;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <g id="compactRail">
      <rect width="304" height="120" rx="7" fill="#fafaf7" stroke="#d1d3cc"/>
      <rect width="304" height="26" rx="7" fill="#f4f4f0"/><path d="M0 20h304v6H0z" fill="#f4f4f0"/>
      <image href="../../../assets/branding/s4quota-mark-small.png" x="10" y="6" width="14" height="14"/>
      <path d="M256 13h8m20-4 9 9m0-9-9 9" class="icon"/>
      <text x="14" y="79" class="num" font-size="44" font-weight="600">72<tspan font-size="21">%</tspan></text>
      <text x="290" y="63" class="num" font-size="24" font-weight="600" text-anchor="end">02:14</text><text x="290" y="79" class="meta" text-anchor="end">until reset</text>
      <rect x="14" y="100" width="276" height="4" rx="2" fill="#dedfd9"/><rect x="14" y="100" width="199" height="4" rx="2" fill="#171816"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="#f4f4f0"/>
  <text x="60" y="58" font-size="24" font-weight="600">Compact cadence rail at Windows scaling</text>
  <text x="60" y="86" class="note">The logical composition does not shrink. Windows maps the same geometry to more device pixels.</text>
  <line x1="60" y1="114" x2="1220" y2="114" stroke="#d1d3cc"/>

  <text x="60" y="154" class="label">100% · 304 × 120 DEVICE PX</text><g transform="translate(60 176)"><use href="#compactRail"/></g>
  <text x="410" y="154" class="label">125% · 380 × 150 DEVICE PX</text><g transform="translate(410 176) scale(1.25)"><use href="#compactRail"/></g>
  <text x="836" y="154" class="label">150% · 456 × 180 DEVICE PX</text><g transform="translate(836 176) scale(1.5)"><use href="#compactRail"/></g>

  <line x1="60" y1="402" x2="1220" y2="402" stroke="#d1d3cc"/>
  <text x="60" y="446" class="label">DEFAULT · WITH RAIL</text>
  <g transform="translate(60 468)"><use href="#compactRail"/></g>
  <text x="396" y="494" font-size="15" font-weight="600">Retain</text>
  <text x="396" y="520" class="note">The 4 px logical track becomes 5 px at 125% and 6 px at 150%.</text>
  <text x="396" y="544" class="note">It improves peripheral recognition without competing with the numbers.</text>

  <text x="740" y="446" class="label">EXTREME REDUCTION · NO RAIL</text>
  <g transform="translate(740 468)"><rect width="304" height="104" rx="7" fill="#fafaf7" stroke="#d1d3cc"/><rect width="304" height="26" rx="7" fill="#f4f4f0"/><path d="M0 20h304v6H0z" fill="#f4f4f0"/><image href="../../../assets/branding/s4quota-mark-small.png" x="10" y="6" width="14" height="14"/><path d="M256 13h8m20-4 9 9m0-9-9 9" class="icon"/><text x="14" y="79" class="num" font-size="44" font-weight="600">72<tspan font-size="21">%</tspan></text><text x="290" y="63" class="num" font-size="24" font-weight="600" text-anchor="end">02:14</text><text x="290" y="79" class="meta" text-anchor="end">until reset</text></g>
  <text x="1080" y="494" font-size="15" font-weight="600">Reserve</text>
  <text x="1080" y="520" class="note">Quieter, but removes the only</text><text x="1080" y="542" class="note">peripheral capacity extent.</text>

  <line x1="60" y1="626" x2="1220" y2="626" stroke="#d1d3cc"/>
  <text x="60" y="660" class="label">VERDICT</text>
  <text x="150" y="660" class="note">Keep the restrained rail in normal Compact. Remove it only if future localization or additional controls force a smaller footprint.</text>
  <text x="1220" y="690" class="meta" text-anchor="end">Logical pixels remain the implementation contract.</text>
</svg>
